<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>vue-h5-editor demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef1f6;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .card {
        width: 340px;
        padding: 28px 24px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      }
      h1 { margin: 0 0 6px; font-size: 20px; color: #1f2329; }
      p { margin: 0 0 20px; color: #5c6470; font-size: 13px; line-height: 20px; }
      a {
        display: block;
        margin-bottom: 10px;
        padding: 12px 14px;
        border: 1px solid #e5e6eb;
        border-radius: 10px;
        color: #1e6fff;
        font-size: 14px;
        text-decoration: none;
      }
      a:hover { background: #f3f6fb; }
      code { color: #8a9099; font-size: 12px; }

  </head>
  <body>
    <div class="card">
      <h1>vue-h5-editor</h1>
      <p>移动端富文本编辑器 demo，选择要预览的运行时。</p>
