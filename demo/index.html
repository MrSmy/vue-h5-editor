<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>h5-rich-editor demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .demo-head {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e6eb;
        color: #1f2329;
        font-size: 15px;
        font-weight: 600;
      }
      .demo-head button {
        padding: 4px 10px;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        background: #fff;
        color: #1f2329;
        font-size: 12px;
      }
      .demo-body { flex: 1; min-height: 0; }
      .output {
        position: fixed;
        inset: 0;
        z-index: 10002;
        display: none;
        margin: 0;
        padding: 24px 16px 96px;
        overflow: auto;
        background: #1f2329;
        color: #d7dae0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 18px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .output.is-visible { display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="demo-head">
        <span>发布公告</span>
        <button type="button" @click="showHtml = !showHtml">
          {{ showHtml ? "收起 HTML" : "查看 HTML" }}
        </button>
      </div>
      <div class="demo-body">
        <h5-editor v-model="html" placeholder="请输入公告内容…" />
      </div>
      <pre :class="['output', showHtml ? 'is-visible' : '']">{{ html }}</pre>
    </div>

    <script src="../node_modules/vue/dist/vue.js"></script>
    <script src="../dist/h5-rich-editor.umd.js"></script>
    <script>
      Vue.use(window.H5RichEditor.default);
      new Vue({
        el: "#app",
        data: {
          showHtml: false,
          html:
            "<h2>本周安排</h2><p>请各班老师<b>周五前</b>提交下周食谱。</p><ul><li><p>核对班级人数</p></li><li><p>更新家长通讯录</p></li></ul>",
        },
      });
    </script>
  </body>
</html>
